name: Release ShiftMate ER

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build ${{ matrix.platform }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install current linuxdeploy
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          TOOLS_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TOOLS_DIR"

          curl -L \
            --fail \
            --show-error \
            --retry 5 \
            --retry-connrefused \
            -o "$TOOLS_DIR/linuxdeploy-x86_64.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"

          chmod +x "$TOOLS_DIR/linuxdeploy-x86_64.AppImage"

          "$TOOLS_DIR/linuxdeploy-x86_64.AppImage" \
            --appimage-extract-and-run \
            --version

          echo "LINUXDEPLOY_EXCLUDED_LIBRARIES=libwayland-*.so*" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          tagName: v__VERSION__
          releaseName: "ShiftMate ER v__VERSION__"

          releaseBody: |
            ## ShiftMate ER v__VERSION__

            Emergency Department shift management and handover application.

            ### Linux
            - AppImage
            - DEB
            - RPM

            ### Windows
            - NSIS installer (.exe)
            - MSI installer (.msi)

          releaseDraft: true
          prerelease: false
